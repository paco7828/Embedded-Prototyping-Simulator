# Embedded Prototyping Simulator - settings
# Edit a value, then restart the program.
# A missing or invalid value falls back to the default written here.

# Temperature in Celsius (typical indoor room temperature)
temperature.min=18
temperature.max=28

# Relative humidity in % (typical indoor humidity)
humidity.min=35
humidity.max=65

# Air pressure in hPa (normal fair-weather range, sea level standard is 1013.25)
pressure.min=1000
pressure.max=1025

# GPS position in degrees (a small area in the centre of Budapest, about 1.1 km x 0.75 km)
gps.latitude.min=47.49
gps.latitude.max=47.50
gps.longitude.min=19.04
gps.longitude.max=19.05

# How many devices fit on one MCU
esp32.max_devices=4
stm32.max_devices=6